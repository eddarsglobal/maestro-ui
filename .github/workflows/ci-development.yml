name: MAESTRO UI - Development CI

on:
  push:
    branches:
      - 'dev/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-build:
    name: TypeScript / UI production build (not product release)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout UI
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require lockfile and declared build script
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          node -e 'const p=require("./package.json"); if (!p.scripts || !p.scripts.build) process.exit(1)'
      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build TypeScript and interface
        run: npm run build
